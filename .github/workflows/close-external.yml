name: Close external issues and pull requests

# Projeto pessoal sem suporte (ver CONTRIBUTING.md): fecha automaticamente
# issues e PRs de quem não é dono/colaborador. Não faz checkout do código do PR.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  close:
    if: >-
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.issue.author_association || github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
        run: |
          body="Este é um projeto pessoal, sem suporte, que não aceita issues, pull requests nem sugestões (ver CONTRIBUTING.md). Fique à vontade para fazer um fork. / This is a personal project with no support and it does not accept issues, pull requests or suggestions (see CONTRIBUTING.md). Feel free to fork it."
          gh "$KIND" close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$body"
